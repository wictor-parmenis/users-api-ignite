stages:
  - build
  - deploy

services:
  - docker:19.03.12-dind

before_script:
  - docker info
  - docker-compose --version

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2

build:
  stage: build
  script:
    - docker-compose build

deploy:
  stage: deploy
  script:
    - docker-compose up -d
